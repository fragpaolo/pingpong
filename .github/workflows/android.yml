name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila l'APK
        run: |
          gradle -p android assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk pingpong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pingpong-apk
          path: pingpong.apk

      # On main, the latest APK is also attached to the "apk" release so it can be
      # downloaded straight from the phone.
      - name: Pubblica l'APK nella release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || \
            gh release create apk --title "Ping Pong per Android" \
              --notes "APK del gioco, aggiornato a ogni modifica su main." --target "$GITHUB_SHA"
          gh release upload apk pingpong.apk --clobber
